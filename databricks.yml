# Databricks Asset Bundle — Streamline Telco "Save Desk" (FE Bar build)
# One deployable unit for the whole journey:
#   Lakeflow pipeline -> Gen AI enrichment -> churn model -> Lakebase -> Genie -> App
#
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run save_desk_nightly -t dev
bundle:
  name: streamline-telco-save-desk

variables:
  catalog:
    default: streamline_telco
  warehouse_id:
    description: Serverless SQL warehouse for SQL tasks and Genie
  app_sp_client_id:
    description: Client id of the save-desk app service principal (after first app deploy)
    default: ""

targets:
  dev:
    mode: development
    default: true

resources:
  pipelines:
    save_desk_ingest:
      name: save-desk-ingest
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      libraries:
        - notebook: {path: ./notebooks/01_ingest_lakeflow.py}

  jobs:
    save_desk_nightly:
      name: save-desk-nightly
      schedule: {quartz_cron_expression: "0 0 2 * * ?", timezone_id: "Europe/Rome"}
      tasks:
        - task_key: ingest
          pipeline_task: {pipeline_id: "${resources.pipelines.save_desk_ingest.id}"}
        - task_key: genai_enrichment
          depends_on: [{task_key: ingest}]
          sql_task: {warehouse_id: "${var.warehouse_id}", file: {path: ./notebooks/02_genai_enrichment.sql}}
        - task_key: governance
          depends_on: [{task_key: genai_enrichment}]
          sql_task: {warehouse_id: "${var.warehouse_id}", file: {path: ./notebooks/00_setup_unity_catalog.sql}}
        - task_key: churn_model
          depends_on: [{task_key: genai_enrichment}]
          notebook_task: {notebook_path: ./notebooks/03_churn_model.py}
        - task_key: lakebase_sync
          depends_on: [{task_key: churn_model}]
          notebook_task:
            notebook_path: ./notebooks/04_lakebase_serving.py
            base_parameters: {app_sp_client_id: "${var.app_sp_client_id}"}

  database_instances:
    save_desk_db:
      name: streamline-save-desk
      capacity: CU_1

  apps:
    save_desk:
      name: save-desk
      description: Retention cockpit — who to call, why, and what to offer
      source_code_path: ./app
      resources:
        - name: lakebase
          database:
            instance_name: streamline-save-desk
            database_name: databricks_postgres
            permission: CAN_CONNECT_AND_CREATE
